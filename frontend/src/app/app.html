<div class="app">
  <header class="topbar">
    <h1 class="marchio">Stoppa</h1>

    <div class="topbar-destra">
      @if (schermata() === 'tavolo') {
        <span class="pillola">Stanza {{ stanza() }}</span>
      } @else if (nome()) {
        <span class="pillola">{{ nome() }}</span>
      }

      <button
        type="button"
        class="ghost icona"
        (click)="alternaAudio()"
        [attr.aria-label]="audio() ? 'Disattiva i suoni' : 'Attiva i suoni'"
      >
        @if (audio()) {
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <path d="M4 9.5v5h3l4.5 3.6V5.9L7 9.5H4z" />
            <path d="M15.5 9a4.2 4.2 0 0 1 0 6" />
            <path d="M18 6.6a7.6 7.6 0 0 1 0 10.8" />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <path d="M4 9.5v5h3l4.5 3.6V5.9L7 9.5H4z" />
            <path d="M16 9.5l5 5M21 9.5l-5 5" />
          </svg>
        }
      </button>
    </div>
  </header>

  @switch (schermata()) {
    @case ('home') {
      <app-home [nomeIniziale]="nome()" (entra)="vaiAllaLobby($event)" />
    }
    @case ('lobby') {
      <app-lobby [nome]="nome()" (indietro)="tornaHome()" (inizia)="avviaPartita($event)" />
    }
    @case ('tavolo') {
      <app-tavolo [nome]="nome()" (esci)="tornaAllaLobby()" />
    }
  }
</div>
